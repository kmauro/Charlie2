x-application-build: &application-build
  build:
    context: .
    target: production

x-application-environment: &application-environment
  APP_NAME: ${APP_NAME:-Clínica}
  APP_ENV: ${DOCKER_APP_ENV:-local}
  APP_KEY: ${APP_KEY:-}
  APP_DEBUG: ${DOCKER_APP_DEBUG:-true}
  APP_URL: ${DOCKER_APP_URL:-http://localhost:8080}
  APP_TIMEZONE: ${APP_TIMEZONE:-America/Argentina/Buenos_Aires}
  APP_LOCALE: ${APP_LOCALE:-es_AR}
  APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-es}
  APP_MAINTENANCE_DRIVER: ${APP_MAINTENANCE_DRIVER:-file}
  BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
  SUPERADMIN_NAME: ${SUPERADMIN_NAME:-}
  SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
  SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
  LOG_CHANNEL: stderr
  LOG_LEVEL: ${LOG_LEVEL:-debug}
  DB_CONNECTION: mysql
  DB_HOST: database
  DB_PORT: 3306
  DB_DATABASE: ${DOCKER_DB_DATABASE:-charlie2}
  DB_USERNAME: ${DOCKER_DB_USERNAME:-charlie2}
  DB_PASSWORD: ${DOCKER_DB_PASSWORD:-charlie2}
  SESSION_DRIVER: database
  SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
  SESSION_ENCRYPT: ${SESSION_ENCRYPT:-false}
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
  EXTERNAL_CLINICAL_RECORD_URL: ${EXTERNAL_CLINICAL_RECORD_URL:-https://historia-clinica.example.test}
  MAIL_MAILER: ${DOCKER_MAIL_MAILER:-smtp}
  MAIL_SCHEME: ${DOCKER_MAIL_SCHEME:-}
  MAIL_HOST: ${DOCKER_MAIL_HOST:-mailpit}
  MAIL_PORT: ${DOCKER_MAIL_PORT:-1025}
  MAIL_USERNAME: ${DOCKER_MAIL_USERNAME:-}
  MAIL_PASSWORD: ${DOCKER_MAIL_PASSWORD:-}
  MAIL_FROM_ADDRESS: ${DOCKER_MAIL_FROM_ADDRESS:-no-reply@charlie2.local}
  MAIL_FROM_NAME: ${APP_NAME:-Clínica}

services:
  app:
    <<: *application-build
    environment:
      <<: *application-environment
      RUN_MIGRATIONS: "true"
    ports:
      - "${DOCKER_APP_PORT:-8080}:80"
    volumes:
      - application-storage:/var/www/html/storage
    depends_on:
      database:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost/up"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10m
    restart: unless-stopped
    stop_grace_period: 30s

  worker:
    <<: *application-build
    environment:
      <<: *application-environment
    command:
      - php
      - artisan
      - queue:work
      - --sleep=3
      - --tries=3
      - --timeout=60
      - --max-time=3600
    volumes:
      - application-storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 90s

  scheduler:
    <<: *application-build
    environment:
      <<: *application-environment
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - application-storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s

  database:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: ${DOCKER_DB_DATABASE:-charlie2}
      MYSQL_USER: ${DOCKER_DB_USERNAME:-charlie2}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:-charlie2}
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:-root}
      TZ: ${APP_TIMEZONE:-America/Argentina/Buenos_Aires}
    ports:
      - "${DOCKER_DB_PORT:-3307}:3306"
    volumes:
      - database-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping --host=127.0.0.1 --user=root --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.1
    ports:
      - "${DOCKER_MAILPIT_PORT:-8025}:8025"
    restart: unless-stopped

volumes:
  application-storage:
  database-data:
